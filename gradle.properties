# 4 GB: with 2 GB, AGP 9.5's R8 ran out of heap (in its keep-radius report)
# when a release build ran alongside the Robolectric tests.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.builtInKotlin=true
android.newDsl=true
android.dependency.useConstraints=false
